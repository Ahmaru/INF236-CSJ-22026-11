<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva calendarizada - DEFIDER</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="container">
    <h1 style="text-align: center;">Añadir Reserva</h1>

    <form id="form-inscripcion">
      <div class="form-group">
        <label for="nombreRecurso">Recurso:</label>
        <input type="text" id="nombreRecurso" name="nombreRecurso" placeholder="Cancha tenis" required>
      </div>

      <div class="form-group">
        <label for="fechaInscripcion">Fecha Asignada:</label>
        <input type="date" id="fechaInscripcion" name="fechaInscripcion" required>
      </div>

      <div class="form-group">
        <label for="bloque">Bloque:</label>
        <input type="text" id="bloque" name="bloque" placeholder="1-2" required>
      </div>

      <div class="form-group">
        <label for="uso">Uso:</label>
        <input type="text" id="uso" name="uso" placeholder="Efi 101 par 2" required>
      </div>

      <div class="form-group">
        <label for="sede">Sede:</label>
        <input type="text" id="sede" name="sede" placeholder="SJ" required>
      </div>

      <button type="submit">Reservar</button>
    </form>

    <div style="text-align: center; margin-top: 18px;">
      <a href="/revisar-reservas" class="btn-back">Volver a mis reservas</a>
    </div>
  </div>

  <script src="inscripcion-calendarizada.js"></script>
</body>
</html>
